# version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ott_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ott_community_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: ott_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysql_data:
